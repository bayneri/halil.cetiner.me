---
layout: default
---
<article class="page notes-page">
  <p class="eyebrow"><a href="{{ '/tags/' | relative_url }}">Topics</a></p>
  <h1>{{ page.autopage.display_name }}</h1>
  <p class="section-note">Notes tagged with this topic.</p>

  {% assign tag_posts = paginator.posts | default: site.tags[page.autopage.display_name] %}
  {% include note_list.html posts=tag_posts %}
  {% include pagination.html label='Topic pagination' %}
</article>
